<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив историй — Моя личная страница</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scroll-progress" id="scroll-progress"></div>

    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="logo">Личная страница.</a>
            <div class="nav-links">
                <a href="index.html">← На главную</a>
                <a href="index.html#about">Обо мне</a>
                <a href="index.html#interests">Интересы</a>
                <a href="index.html#stories">Истории</a>
                <button id="theme-toggle">Тёмная тема</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="fade-in">
            <span class="section-label">АРХИВ</span>
            <h2>Все мои истории</h2>
            <p class="stories-intro">
                Здесь собраны все небольшие заметки, воспоминания
                и интересные события из моей жизни.
                Нажми на карточку, чтобы прочитать историю.
            </p>

            <div class="stories-grid">
                <article class="story-card">
                    <button class="story-button" data-story="music-math">
                        <span class="story-category">МУЗЫКА И МАТЕМАТИКА</span>
                        <span class="story-title">Как музыка познакомила меня с числом e</span>
                        <span class="story-description">
                            История о необычном изображении,
                            которое объединило музыку и математику.
                        </span>
                        <span class="story-read">Читать историю →</span>
                    </button>
                </article>

                <article class="story-card">
                    <button class="story-button" data-story="first-penmod">
                        <span class="story-category">ПЕНСПИННИНГ</span>
                        <span class="story-title">Мой первый пенмод</span>
                        <span class="story-description">
                            Как одно видео про трюки с ручкой положило
                            начало целой коллекции пенмодов.
                        </span>
                        <span class="story-read">Читать историю →</span>
                    </button>
                </article>

                <article class="story-card">
                    <button class="story-button" data-story="first-cube">
                        <span class="story-category">СПИДКУБИНГ</span>
                        <span class="story-title">Как я начал собирать кубик</span>
                        <span class="story-description">
                            От трёх минут с подсказками до 15
                            секунд и почти девяти лет увлечения.
                        </span>
                        <span class="story-read">Читать историю →</span>
                    </button>
                </article>
            </div>
        </section>
    </main>

    <dialog id="story-dialog" class="story-dialog">
        <div class="story-dialog-content">
            <button class="story-close" aria-label="Закрыть">×</button>
            <span class="story-category" id="dialog-category"></span>
            <h2 id="dialog-title"></h2>
            <div id="dialog-body"></div>
        </div>
    </dialog>

    <button class="scroll-top" id="scroll-top" aria-label="Наверх">↑</button>

    <footer>
        <p>© 2026. Моя личная страница.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
